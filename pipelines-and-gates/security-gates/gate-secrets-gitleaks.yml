# RECOMMENDED gate (optional template): secret scanning with gitleaks.
# Copy to .github/workflows/ and adapt. Not part of the default pipelines.
name: gate-secrets
on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so previously committed secrets are found
          persist-credentials: false

      # Binary download with checksum verification (no third-party action needed).
      - name: Install gitleaks (pinned, checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          V=8.21.2
          F="gitleaks_${V}_linux_x64.tar.gz"
          B="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${B}/${F}"
          curl -fsSLO "${B}/gitleaks_${V}_checksums.txt"
          grep " ${F}\$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "$F" gitleaks
          sudo mv gitleaks /usr/local/bin/

      # Threshold: any finding fails the job. --redact keeps values out of logs.
      # To accept existing findings temporarily, create a baseline file and add:
      #   --baseline-path .gitleaks-baseline.json
      - name: Scan
        run: gitleaks git --redact --verbose --exit-code 1 .
