# yamllint configuration for pipelines and workflows (template).
extends: default

rules:
  line-length:
    max: 160
    level: warning
  truthy:
    # GitHub Actions uses the key "on".
    allowed-values: ['true', 'false', 'on']
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
